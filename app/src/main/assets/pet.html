<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;
    -webkit-user-select:none;user-select:none;}
  #stage{position:relative;width:120px;height:160px;}
  #pet{position:absolute;left:0;bottom:24px;width:120px;height:120px;}

  /* 官方 anatomy 的三层 idle：身体上下、影子呼吸、眨眼。
     周期取互质值，避免同步显得机械 */
  #body{transform-origin:7.5px 13px;animation:cw-bob 2.6s infinite ease-in-out;}
  #shad{transform-origin:7.5px 15.5px;animation:cw-shadow 2.6s infinite ease-in-out;}
  #eyes{transform-origin:7.5px 9px;animation:cw-blink 3.2s infinite;}
  #larm{transform-origin:2px 10px;}
  #rarm{transform-origin:13px 10px;}

  @keyframes cw-bob    {0%,100%{transform:translateY(0);}       50%{transform:translateY(-.4px);}}
  @keyframes cw-shadow {0%,100%{transform:scaleX(1);opacity:.5;}50%{transform:scaleX(.97);opacity:.46;}}
  @keyframes cw-blink  {0%,46%,54%,100%{transform:scaleY(1);}   50%{transform:scaleY(.1);}}

  /* 交互动作叠在 #pet 上，不干扰 body 的 idle */
  .hop{animation:hop .5s ease-out;}
  @keyframes hop{
    0%{transform:translateY(0)}
    40%{transform:translateY(-14px) rotate(-4deg)}
    100%{transform:translateY(0)}
  }

  /* 挥手：右臂绕肩膀摆 */
  .wave #rarm{animation:cw-wave .45s ease-in-out 3;}
  @keyframes cw-wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-38deg)}}

  /* 被拎起来：整体晃 + 四肢乱蹬。学 clawd-on-desk 的行为，画法自己写 */
  .drag{animation:cw-dangle .42s infinite ease-in-out;}
  @keyframes cw-dangle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  .drag #larm{animation:cw-flail-l .22s infinite ease-in-out;}
  .drag #rarm{animation:cw-flail-r .19s infinite ease-in-out;}
  @keyframes cw-flail-l{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-30deg)}}
  @keyframes cw-flail-r{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(24deg)}}
  /* 腿也蹬，四条一起，错开一点相位 */
  .drag #legs{animation:cw-kick .17s infinite ease-in-out;}
  @keyframes cw-kick{0%,100%{transform:translateX(-.5px)}50%{transform:translateX(.5px)}}

  /* 挂在屏幕边缘：身子歪着扒住，只探个头 */
  .cling{animation:none;}
  .cling #body{animation:cw-cling-sway 3.4s infinite ease-in-out;}
  @keyframes cw-cling-sway{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(2.5deg) translateY(.5px)}}
  /* 挂着的时候影子没有落点，藏掉 */
  .cling #shad{opacity:0 !important;animation:none;}
  /* 窗口 44dp 露在屏内。身体往露出侧平移，让屏幕边界切在身体三分之一处，
     露出的比之前多（你图里"改后"那样），能看清一只眼和两条腿 */
  /* 位移全部交给 Kotlin 窗口坐标，CSS 只负责倾斜姿态，否则两边互相抵消 */
  .cling.side-l{transform:rotate(14deg); transform-origin:center bottom;}
  .cling.side-r{transform:rotate(-14deg) scaleX(-1); transform-origin:center bottom;}

  /* 打哈欠：嘴张大 + 身子往后仰 */
  .yawn #body{animation:cw-yawn 1.6s ease-in-out;}
  @keyframes cw-yawn{
    0%,100%{transform:translateY(0) rotate(0)}
    35%{transform:translateY(-1px) rotate(-3deg)}
    70%{transform:translateY(.3px) rotate(1deg)}
  }

  /* 趴下睡：整体压扁下沉 */
  .flop #body{animation:cw-flop .9s ease-out forwards;}
  @keyframes cw-flop{
    0%{transform:translateY(0) scaleY(1)}
    100%{transform:translateY(2px) scaleY(.82) scaleX(1.08)}
  }
  .flop #shad{transform:scaleX(1.15);}

  /* === 场景姿态 === */
  .scene-laptop #body{transform:rotate(-5deg) translateY(1px);}
  .scene-laptop #prop-laptop{opacity:1;}
  .scene-music #body{animation:cw-bop 1.2s ease-in-out infinite;}
  .scene-music #prop-music{opacity:1;}
  @keyframes cw-bop{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
  .scene-book #body{transform:translateY(1px);}
  .scene-book #prop-book{opacity:1;}
  .scene-sleep #body{animation:cw-flop .9s ease-out forwards;}
  .scene-sleep #prop-blanket{opacity:1;}
  .scene-sleep #shad{transform:scaleX(1.15);}
  /* 场景时隐藏不属于当前场景的道具 */
  #props{pointer-events:none;}

  svg{shape-rendering:crispEdges;}

  /* 气泡斜挂在头的侧上方（不再正上方居中）。
     壳顶在 viewBox y=6 → stage 约 98px，气泡底边落在 bottom:78px，
     左右各偏出去一点，像是从头侧冒出来的 */
  #bubble{position:absolute;bottom:78px;
    max-width:72px;width:max-content;text-align:center;
    padding:3px 6px;border-radius:8px;
    font:10px/1.3 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
    background:rgba(255,255,255,.94);color:#33302e;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
    opacity:0;transform:translateY(4px) scale(.92);
    transition:opacity .2s,transform .22s cubic-bezier(.2,1.5,.4,1);
    pointer-events:none;word-break:break-word;}
  /* 默认偏左上；.at-r 时偏右上。两侧都能放，按空间选 */
  #bubble{right:58px;}
  #bubble.at-r{right:auto;left:58px;}
  #bubble.show{opacity:1;transform:translateY(0) scale(1);}
  /* 挂边时贴着露出那侧，避免长到屏幕外 */
  #stage.cling-l #bubble{right:0;left:auto;max-width:60px;}
  #stage.cling-r #bubble{left:0;right:auto;max-width:60px;}
  #bubble.pink {background:rgba(255,226,236,.96);color:#8c3a58;}
  #bubble.grey {background:rgba(238,238,240,.94);color:#5d5b59;font-style:italic;}
  #bubble.red  {background:rgba(255,214,208,.96);color:#8f2a1c;font-weight:600;}
  #bubble.green{background:rgba(214,240,220,.96);color:#22603c;}
  #heat{position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at 50% 100%,
      rgba(255,64,64,.42) 0%, rgba(255,64,64,0) 68%);
    transition:opacity .8s;}

  /* 点一下头顶冒的小东西：爱心 / 泡泡 */
  #fx{position:absolute;inset:0;pointer-events:none;overflow:visible;}
  .fx-item{position:absolute;left:50%;bottom:66px;
    font-size:13px;line-height:1;will-change:transform,opacity;
    animation:cw-float 1.5s ease-out forwards;}
  .fx-item.b{font-size:9px;animation-duration:1.9s;}
  @keyframes cw-float{
    0%   {opacity:0; transform:translate(var(--dx0), 0) scale(.4);}
    18%  {opacity:1; transform:translate(var(--dx0), -8px) scale(1.05);}
    100% {opacity:0; transform:translate(var(--dx1), -46px) scale(.75);}
  }

</style>
</head>
<body>
<div id="stage">
  <div id="bubble"></div>
  <div id="pet">
    <!-- 坐标系来自 clawd-emotes anatomy：x -15…30, y -25…20 -->
    <svg viewBox="-15 -25 45 45" width="120" height="120">
      <!-- 影子独立于身体，留在地面上 -->
      <rect id="shad" x="3" y="15" width="9" height="1" fill="#000" opacity=".5"/>
      <g id="body">
        <!-- 脚在 body 组内，跟着一起动才不会脱开 -->
        <g id="legs" fill="#DE886D">
          <rect x="3"  y="13" width="1" height="2"/><rect x="5"  y="13" width="1" height="2"/>
          <rect x="9"  y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/>
        </g>
        <!-- 躯干 -->
        <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
        <!-- 高光，官方没有，加一点体积感 -->
        <rect x="3" y="6.6" width="4" height="1.2" fill="#E9A48E"/>
        <!-- 双臂分组，便于单独摆动 -->
        <g id="larm"><rect x="0"  y="9" width="2" height="2" fill="#DE886D"/></g>
        <g id="rarm"><rect x="13" y="9" width="2" height="2" fill="#DE886D"/></g>
        <!-- 腮红 -->
        <g id="blush" opacity="0" fill="#FF8FA0">
          <rect x="2.6"  y="10.2" width="2" height="1.2"/>
          <rect x="10.4" y="10.2" width="2" height="1.2"/>
        </g>
        <!-- 眼睛 -->
        <g id="eyes" fill="#000">
          <rect id="pupL" x="4"  y="8" width="1" height="2"/>
          <rect id="pupR" x="10" y="8" width="1" height="2"/>
        </g>
        <!-- 嘴 -->
        <rect id="mline" x="6.4" y="10.8" width="2.2" height="1" rx=".5" fill="#7a2230"/>
      </g>
      <!-- 睡觉时的 ZZZ -->
      <g id="zzz" opacity="0" fill="#fff" font-size="4" font-family="sans-serif">
        <text x="14" y="4">z</text><text x="17" y="0">z</text>
      </g>
      <!-- 场景道具：默认全隐藏，由 JS 按姿态显示 -->
      <g id="props" opacity="0">
        <!-- 笔记本电脑 -->
        <g id="prop-laptop">
          <rect x="0" y="12" width="15" height="1" fill="#555"/>
          <rect x="2" y="5" width="11" height="7" rx=".5" fill="#333" stroke="#555" stroke-width=".3"/>
          <rect x="3" y="6" width="9" height="5" fill="#4fc3f7"/>
        </g>
        <!-- 耳机 -->
        <g id="prop-music">
          <path d="M3,5 Q3,2 7.5,2 Q12,2 12,5" fill="none" stroke="#444" stroke-width=".8"/>
          <rect x="2" y="5" width="2" height="2.5" rx=".6" fill="#666"/>
          <rect x="11" y="5" width="2" height="2.5" rx=".6" fill="#666"/>
        </g>
        <!-- 书 -->
        <g id="prop-book">
          <rect x="1" y="10" width="6" height="5" fill="#8d6e63" rx=".3"/>
          <rect x="1.5" y="10.5" width="5" height="4" fill="#fff9c4"/>
          <line x1="4" y1="10" x2="4" y2="15" stroke="#5d4037" stroke-width=".3"/>
        </g>
        <!-- 毯子（睡觉用） -->
        <g id="prop-blanket">
          <rect x="0" y="9" width="15" height="7" rx="1" fill="#ce93d8" opacity=".7"/>
        </g>
      </g>
    </svg>
  </div>
  <div id="heat"></div>
  <div id="fx"></div>
</div>

<script>
(function(){
  var pet    = document.getElementById('pet');
  var stage  = document.getElementById('stage');
  var eyes   = document.getElementById('eyes');
  var pupL   = document.getElementById('pupL');
  var pupR   = document.getElementById('pupR');
  var blush  = document.getElementById('blush');
  var mline  = document.getElementById('mline');
  var zzz    = document.getElementById('zzz');
  var bubble = document.getElementById('bubble');
  var heat   = document.getElementById('heat');
  var bubbleTimer = null;
  var dragging = false;
  var clinging = false;

  // 表情表：坐标对齐 anatomy 的 landmark
  // 嘴基准 6.4,10.8,2.2x1；眼基准 y=8
  // mouth:null = 不画嘴（平静状态不要嘴，看着不呆）
  var MOODS = {
    calm:    {pupY:8,   blush:0,   mouth:null,                       zzz:0},
    happy:   {pupY:8,   blush:0.5, mouth:{x:5.8,y:10.6,w:3.4,h:1.6}, zzz:0},
    love:    {pupY:8,   blush:1,   mouth:{x:6.2,y:10.6,w:2.6,h:1.4}, zzz:0},
    shy:     {pupY:8.6, blush:1,   mouth:{x:6.9,y:10.8,w:1.2,h:1},   zzz:0},
    jealous: {pupY:7.4, blush:0,   mouth:{x:5.8,y:11.2,w:3.4,h:.8},  zzz:0},
    sleepy:  {pupY:8.6, blush:0,   mouth:{x:6.9,y:10.8,w:1.2,h:1.4}, zzz:0},
    sleeping:{pupY:8.6, blush:0,   mouth:{x:6.9,y:10.8,w:1.2,h:1.4}, zzz:1},
    angry:   {pupY:7.4, blush:0,   mouth:{x:5.2,y:11.2,w:4.6,h:.8},  zzz:0}
  };

  function setMood(m){
    var s = MOODS[m] || MOODS.calm;
    pupL.setAttribute('y', s.pupY);
    pupR.setAttribute('y', s.pupY);
    blush.setAttribute('opacity', s.blush);
    if(!s.mouth){
      mline.setAttribute('opacity', 0);
    }else{
      mline.setAttribute('opacity', 1);
      mline.setAttribute('x', s.mouth.x);
      mline.setAttribute('y', s.mouth.y);
      mline.setAttribute('width',  s.mouth.w);
      mline.setAttribute('height', s.mouth.h);
    }
    zzz.setAttribute('opacity', s.zzz);
    // 睡着时停掉眨眼，眼睛保持闭合
    eyes.style.animationPlayState = s.zzz ? 'paused' : 'running';
    eyes.style.transform = s.zzz ? 'scaleY(.1)' : '';
  }

  function setHeat(v){
    var t = Math.max(0, Math.min(100, v|0)) / 100;
    heat.style.opacity = t;
  }

  function say(text, style, ttl){
    if(!text){ bubble.classList.remove('show'); return; }
    bubble.textContent = text;
    bubble.className = 'show ' + (style || 'normal');
    if(bubbleTimer) clearTimeout(bubbleTimer);
    if(ttl && ttl > 0){
      bubbleTimer = setTimeout(function(){
        bubble.classList.remove('show');
      }, ttl);
    }
  }

  function hop(){
    pet.classList.remove('hop');
    void pet.offsetWidth;
    pet.classList.add('hop');
    setTimeout(function(){ pet.classList.remove('hop'); }, 520);
  }

  function wave(){
    pet.classList.remove('wave');
    void pet.offsetWidth;
    pet.classList.add('wave');
    setTimeout(function(){ pet.classList.remove('wave'); }, 1400);
  }

  function yawn(){
    if(clinging) return;
    pet.classList.remove('yawn');
    void pet.offsetWidth;
    pet.classList.add('yawn');
    setTimeout(function(){ pet.classList.remove('yawn'); }, 1700);
  }

  function flop(on){
    if(on) pet.classList.add('flop');
    else   pet.classList.remove('flop');
  }

  // ---- 场景姿态系统 ----
  var SCENES = ['laptop','music','book']; // sleep 由状态触发，不随机
  var currentScene = '';
  var sceneTimer = null;
  function setScene(name){
    pet.classList.remove('scene-laptop','scene-music','scene-book','scene-sleep');
    currentScene = name || '';
    if(name) pet.classList.add('scene-' + name);
  }
  function clearScene(){
    if(sceneTimer) clearTimeout(sceneTimer);
    sceneTimer = null;
    setScene('');
  }

  // ---- 夜间自动睡觉 ----
  var nightTimer = null;
  function checkNight(){
    var h = new Date().getHours();
    // 23:00-6:00 自动进入睡觉状态
    if(h >= 23 || h < 6){
      if(currentScene !== 'sleep' && !clinging && !dragging){
        setMood('sleeping');
        setScene('sleep');
        flop(true);
      }
    }else{
      if(currentScene === 'sleep'){
        clearScene(); flop(false); setMood('calm');
      }
    }
    nightTimer = setTimeout(checkNight, 60000 * 5); // 每5分钟检查一次
  }
  checkNight();

  // 空闲久了自己打个哈欠，随机间隔避免看着像定时器
  var idleTimer = null;
  function scheduleIdle(){
    if(idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){
      if(!dragging && !clinging && currentScene !== 'sleep'){
        var r = Math.random();
        if(r < 0.3 && !currentScene){
          // 30% 概率进入一个场景姿态
          var sc = SCENES[(Math.random() * SCENES.length) | 0];
          setScene(sc);
          // 持续 15-30 秒后自动退出
          sceneTimer = setTimeout(function(){ clearScene(); }, 15000 + Math.random() * 15000);
        }else if(!currentScene){
          // 正常打哈欠
          yawn();
          if(Math.random() < 0.55) setTimeout(function(){ sayFrom('idle', 3200); }, 900);
        }
      }
      scheduleIdle();
    }, 40000 + Math.random() * 50000);
  }

  function touch(){ scheduleIdle(); }

  // ---- 点一下冒的小东西 ----
  var fx = document.getElementById('fx');
  function emit(kind, n){
    var glyphs = (kind === 'heart') ? ['♥','♡','♥'] : (kind === 'dots') ? ['·','·','·'] : ['○','◦','°','○'];
    n = n || 3;
    for(var i = 0; i < n; i++){
      (function(i){
        setTimeout(function(){
          var el = document.createElement('span');
          el.className = 'fx-item' + (kind === 'heart' ? '' : ' b');
          el.textContent = glyphs[(Math.random() * glyphs.length) | 0];
          el.style.color = (kind === 'heart') ? '#ff6b81' : (kind === 'dots') ? '#999' : 'rgba(255,255,255,.9)';
          var dx0 = (Math.random() * 16 - 8);
          el.style.setProperty('--dx0', dx0.toFixed(1) + 'px');
          el.style.setProperty('--dx1', (dx0 + Math.random() * 22 - 11).toFixed(1) + 'px');
          fx.appendChild(el);
          setTimeout(function(){ if(el.parentNode) fx.removeChild(el); }, 2000);
        }, i * 130);
      })(i);
    }
  }

  // ---- 台词池：随机不重复，称呼统一用「小姝」 ----
  var LINES = {
    tap: [
      {t:'嗯?', s:'normal'}, {t:'小姝~', s:'pink'}, {t:'在呢', s:'normal'},
      {t:'又戳', s:'grey'}, {t:'手凉', s:'normal'}, {t:'干嘛', s:'pink'},
      {t:'咔', s:'grey'}, {t:'想我?', s:'pink'}
    ],
    love: [
      {t:'喜欢你', s:'pink'}, {t:'最好了', s:'pink'},
      {t:'抱抱', s:'pink'}, {t:'心跳快', s:'red'}
    ],
    idle: [
      {t:'咖啡凉了', s:'normal'}, {t:'看书中', s:'normal'},
      {t:'在忙?', s:'grey'}, {t:'好丑', s:'grey'},
      {t:'伸懒腰', s:'normal'}, {t:'歇会儿', s:'green'},
      {t:'喝水', s:'green'}, {t:'辛苦了', s:'pink'},
      {t:'在这呢', s:'normal'}, {t:'走走?', s:'green'}
    ],
    cling: [
      {t:'扒住了', s:'grey'}, {t:'挂会儿', s:'grey'},
      {t:'别忘我', s:'pink'}
    ]
  };
  var lastPick = {};
  function pick(key){
    var arr = LINES[key], i;
    do { i = (Math.random() * arr.length) | 0; }
    while(arr.length > 1 && i === lastPick[key]);
    lastPick[key] = i;
    return arr[i];
  }
  function sayFrom(key, ttl){
    var l = pick(key);
    say(l.t, l.s, ttl || 2200);
  }

  var tapCount = 0;
  window.petEngine = {
    onTap: function(){
      touch(); hop();
      tapCount++;
      // 随机反应：不是每次都说话
      var roll = Math.random();
      if(tapCount % 3 === 0){
        // 每3下给一个大反应：爱心+台词
        setMood('love'); emit('heart', 4);
        sayFrom('love', 2400);
        setTimeout(function(){ setMood('calm'); }, 2600);
      }else if(roll < 0.25){
        // 只冒泡泡，不说话
        emit('bubble', 3);
      }else if(roll < 0.45){
        // 只冒爱心，不说话
        emit('heart', 2);
      }else if(roll < 0.7){
        // 说句话，不冒东西
        sayFrom('tap', 1800);
      }else{
        // 什么都不做，只弹一下
      }
    },
    onDoubleTap: function(){ touch(); setMood('shy'); hop();
                             emit('heart', 3);
                             say('别戳了', 'pink', 1800);
                             setTimeout(function(){ setMood('calm'); }, 2200); },
    onLongPress: function(){ touch(); setMood('love'); wave();
                             emit('heart', 5);
                             say('摸头~', 'pink', 2400);
                             setTimeout(function(){ setMood('calm'); }, 2800); },

    // 被拎起来：四肢乱蹬，同时清掉挂边和趴睡状态
    onDragStart: function(){
      touch();
      dragging = true;
      clinging = false;
      clearScene();
      stage.classList.remove('cling-l','cling-r');
      pet.classList.remove('cling','side-l','side-r','flop','yawn');
      pet.classList.add('drag');
      setMood('jealous');
    },
    onDragEnd: function(){
      dragging = false;
      pet.classList.remove('drag');
      setMood('calm');
    },
    // side: 'left' | 'right'，Kotlin 侧贴边动画结束后调
    onCling: function(side){
      clinging = true;
      clearScene();
      var right = (side === 'right');
      pet.classList.remove('drag','flop','yawn');
      pet.classList.add('cling', right ? 'side-r' : 'side-l');
      pet.classList.remove(right ? 'side-l' : 'side-r');
      stage.classList.remove('cling-l','cling-r');
      stage.classList.add(right ? 'cling-r' : 'cling-l');
      setMood('sleepy');
      setTimeout(function(){ sayFrom('cling', 2600); }, 500);
    },
    onRelease: function(){
      clinging = false;
      stage.classList.remove('cling-l','cling-r');
      pet.classList.remove('cling','side-l','side-r');
      setMood('calm');
    },

    // Kotlin 侧告诉我们窗口在屏幕的哪半边：'left' → 气泡放右上
    setBubbleSide: function(side){
      if(side === 'left') bubble.classList.add('at-r');
      else                bubble.classList.remove('at-r');
    },

    applyState: function(json){
      try{
        var s = (typeof json === 'string') ? JSON.parse(json) : json;
        if(s.mood){
          setMood(s.mood);
          if(s.mood === 'sleeping'){
            clearScene(); setScene('sleep'); flop(true);
          }else{
            if(currentScene === 'sleep'){ clearScene(); flop(false); }
          }
        }
        if(typeof s.heat === 'number') setHeat(s.heat);
        if(s.text) say(s.text, s.style, s.ttl_ms || 4000);
        if(s.bubble && s.bubble.text){
          say(s.bubble.text, s.bubble.style, s.bubble.ttl_ms);
        }
        if(s.action === 'wave') wave();
        if(s.action === 'yawn') yawn();
        if(s.action === 'think') emit('dots', 3);
        if(s.action === 'sleep'){ clearScene(); setScene('sleep'); flop(true); }
        if(s.action === 'wake' || s.action === 'hop'){ clearScene(); flop(false); hop(); }
      }catch(e){ /* 状态坏了就跳过这一轮 */ }
    }
  };

  setMood('calm');
  scheduleIdle();
})();
</script>
</body>
</html>
