<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;
    -webkit-user-select:none;user-select:none;}
  #stage{position:relative;width:120px;height:160px;}
  #pet{position:absolute;left:0;bottom:24px;width:120px;height:120px;}

  /* 官方 anatomy 的三层 idle：身体上下、影子呼吸、眨眼。
     周期取互质值，避免同步显得机械 */
  #body{transform-origin:7.5px 13px;animation:cw-bob 2.6s infinite ease-in-out;}
  #shad{transform-origin:7.5px 15.5px;animation:cw-shadow 2.6s infinite ease-in-out;}
  #eyes{transform-origin:7.5px 9px;animation:cw-blink 3.2s infinite;}
  #larm{transform-origin:2px 10px;}
  #rarm{transform-origin:13px 10px;}

  @keyframes cw-bob    {0%,100%{transform:translateY(0);}       50%{transform:translateY(-.4px);}}
  @keyframes cw-shadow {0%,100%{transform:scaleX(1);opacity:.5;}50%{transform:scaleX(.97);opacity:.46;}}
  @keyframes cw-blink  {0%,46%,54%,100%{transform:scaleY(1);}   50%{transform:scaleY(.1);}}

  /* 交互动作叠在 #pet 上，不干扰 body 的 idle */
  .hop{animation:hop .5s ease-out;}
  @keyframes hop{
    0%{transform:translateY(0)}
    40%{transform:translateY(-14px) rotate(-4deg)}
    100%{transform:translateY(0)}
  }

  /* 挥手：右臂绕肩膀摆 */
  .wave #rarm{animation:cw-wave .45s ease-in-out 3;}
  @keyframes cw-wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-38deg)}}

  /* 被拎起来：整体晃 + 四肢乱蹬。学 clawd-on-desk 的行为，画法自己写 */
  .drag{animation:cw-dangle .42s infinite ease-in-out;}
  @keyframes cw-dangle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  .drag #larm{animation:cw-flail-l .22s infinite ease-in-out;}
  .drag #rarm{animation:cw-flail-r .19s infinite ease-in-out;}
  @keyframes cw-flail-l{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-30deg)}}
  @keyframes cw-flail-r{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(24deg)}}
  /* 腿也蹬，四条一起，错开一点相位 */
  .drag #legs{animation:cw-kick .17s infinite ease-in-out;}
  @keyframes cw-kick{0%,100%{transform:translateX(-.5px)}50%{transform:translateX(.5px)}}

  /* 挂在屏幕边缘：身子歪着扒住，只探个头 */
  .cling{animation:none;}
  .cling #body{animation:cw-cling-sway 3.4s infinite ease-in-out;}
  @keyframes cw-cling-sway{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(2.5deg) translateY(.5px)}}
  /* 挂着的时候影子没有落点，藏掉 */
  .cling #shad{opacity:0 !important;animation:none;}
  /* 窗口只有 34dp 露在屏内，身体默认在窗口正中会被整块切掉，
     所以往露出那侧平移，让屏幕边界正好切在身体中线上 —— 探头效果 */
  .cling.side-l{transform:translateX(26px);}
  .cling.side-r{transform:translateX(-26px) scaleX(-1);}

  /* 打哈欠：嘴张大 + 身子往后仰 */
  .yawn #body{animation:cw-yawn 1.6s ease-in-out;}
  @keyframes cw-yawn{
    0%,100%{transform:translateY(0) rotate(0)}
    35%{transform:translateY(-1px) rotate(-3deg)}
    70%{transform:translateY(.3px) rotate(1deg)}
  }

  /* 趴下睡：整体压扁下沉 */
  .flop #body{animation:cw-flop .9s ease-out forwards;}
  @keyframes cw-flop{
    0%{transform:translateY(0) scaleY(1)}
    100%{transform:translateY(2px) scaleY(.82) scaleX(1.08)}
  }
  .flop #shad{transform:scaleX(1.15);}

  svg{shape-rendering:crispEdges;}

  /* 气泡贴着头顶：螃蟹壳顶在 viewBox y=6，换算到 stage 约 98px 处，
     所以气泡底边放在 bottom:64px，向上生长 */
  #bubble{position:absolute;left:50%;transform:translateX(-50%);
    bottom:64px;max-width:112px;width:max-content;text-align:center;
    padding:5px 8px;border-radius:9px;
    font:11px/1.35 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
    background:rgba(255,255,255,.94);color:#33302e;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
    opacity:0;transition:opacity .22s;pointer-events:none;
    word-break:break-word;}
  #bubble.show{opacity:1;}
  /* 挂边时气泡不能居中，会长到屏幕外去，改成贴着露出那侧 */
  #stage.cling-l #bubble{left:auto;right:0;transform:none;max-width:96px;}
  #stage.cling-r #bubble{left:0;right:auto;transform:none;max-width:96px;}
  #bubble.pink {background:rgba(255,226,236,.96);color:#8c3a58;}
  #bubble.grey {background:rgba(238,238,240,.94);color:#5d5b59;font-style:italic;}
  #bubble.red  {background:rgba(255,214,208,.96);color:#8f2a1c;font-weight:600;}
  #bubble.green{background:rgba(214,240,220,.96);color:#22603c;}

  #heat{position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at 50% 100%,
      rgba(255,64,64,.42) 0%, rgba(255,64,64,0) 68%);
    transition:opacity .8s;}
</style>
</head>
<body>
<div id="stage">
  <div id="bubble"></div>
  <div id="pet">
    <!-- 坐标系来自 clawd-emotes anatomy：x -15…30, y -25…20 -->
    <svg viewBox="-15 -25 45 45" width="120" height="120">
      <!-- 影子独立于身体，留在地面上 -->
      <rect id="shad" x="3" y="15" width="9" height="1" fill="#000" opacity=".5"/>
      <g id="body">
        <!-- 脚在 body 组内，跟着一起动才不会脱开 -->
        <g id="legs" fill="#DE886D">
          <rect x="3"  y="13" width="1" height="2"/><rect x="5"  y="13" width="1" height="2"/>
          <rect x="9"  y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/>
        </g>
        <!-- 躯干 -->
        <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
        <!-- 高光，官方没有，加一点体积感 -->
        <rect x="3" y="6.6" width="4" height="1.2" fill="#E9A48E"/>
        <!-- 双臂分组，便于单独摆动 -->
        <g id="larm"><rect x="0"  y="9" width="2" height="2" fill="#DE886D"/></g>
        <g id="rarm"><rect x="13" y="9" width="2" height="2" fill="#DE886D"/></g>
        <!-- 腮红 -->
        <g id="blush" opacity="0" fill="#FF8FA0">
          <rect x="2.6"  y="10.2" width="2" height="1.2"/>
          <rect x="10.4" y="10.2" width="2" height="1.2"/>
        </g>
        <!-- 眼睛 -->
        <g id="eyes" fill="#000">
          <rect id="pupL" x="4"  y="8" width="1" height="2"/>
          <rect id="pupR" x="10" y="8" width="1" height="2"/>
        </g>
        <!-- 嘴 -->
        <rect id="mline" x="6.4" y="10.8" width="2.2" height="1" rx=".5" fill="#7a2230"/>
      </g>
      <!-- 睡觉时的 ZZZ -->
      <g id="zzz" opacity="0" fill="#fff" font-size="4" font-family="sans-serif">
        <text x="14" y="4">z</text><text x="17" y="0">z</text>
      </g>
    </svg>
  </div>
  <div id="heat"></div>
</div>

<script>
(function(){
  var pet    = document.getElementById('pet');
  var stage  = document.getElementById('stage');
  var eyes   = document.getElementById('eyes');
  var pupL   = document.getElementById('pupL');
  var pupR   = document.getElementById('pupR');
  var blush  = document.getElementById('blush');
  var mline  = document.getElementById('mline');
  var zzz    = document.getElementById('zzz');
  var bubble = document.getElementById('bubble');
  var heat   = document.getElementById('heat');
  var bubbleTimer = null;
  var dragging = false;
  var clinging = false;

  // 表情表：坐标对齐 anatomy 的 landmark
  // 嘴基准 6.4,10.8,2.2x1；眼基准 y=8
  var MOODS = {
    calm:    {pupY:8,   blush:0,   mouth:{x:6.4,y:10.8,w:2.2,h:1},   zzz:0},
    happy:   {pupY:8,   blush:0.5, mouth:{x:5.8,y:10.6,w:3.4,h:1.6}, zzz:0},
    love:    {pupY:8,   blush:1,   mouth:{x:6.2,y:10.6,w:2.6,h:1.4}, zzz:0},
    shy:     {pupY:8.6, blush:1,   mouth:{x:6.9,y:10.8,w:1.2,h:1},   zzz:0},
    jealous: {pupY:7.4, blush:0,   mouth:{x:5.8,y:11.2,w:3.4,h:.8},  zzz:0},
    sleepy:  {pupY:8.6, blush:0,   mouth:{x:6.9,y:10.8,w:1.2,h:1.4}, zzz:0},
    sleeping:{pupY:8.6, blush:0,   mouth:{x:6.9,y:10.8,w:1.2,h:1.4}, zzz:1},
    angry:   {pupY:7.4, blush:0,   mouth:{x:5.2,y:11.2,w:4.6,h:.8},  zzz:0}
  };

  function setMood(m){
    var s = MOODS[m] || MOODS.calm;
    pupL.setAttribute('y', s.pupY);
    pupR.setAttribute('y', s.pupY);
    blush.setAttribute('opacity', s.blush);
    mline.setAttribute('x', s.mouth.x);
    mline.setAttribute('y', s.mouth.y);
    mline.setAttribute('width',  s.mouth.w);
    mline.setAttribute('height', s.mouth.h);
    zzz.setAttribute('opacity', s.zzz);
    // 睡着时停掉眨眼，眼睛保持闭合
    eyes.style.animationPlayState = s.zzz ? 'paused' : 'running';
    eyes.style.transform = s.zzz ? 'scaleY(.1)' : '';
  }

  function setHeat(v){
    var t = Math.max(0, Math.min(100, v|0)) / 100;
    heat.style.opacity = t;
  }

  function say(text, style, ttl){
    if(!text){ bubble.classList.remove('show'); return; }
    bubble.textContent = text;
    bubble.className = 'show ' + (style || 'normal');
    if(bubbleTimer) clearTimeout(bubbleTimer);
    if(ttl && ttl > 0){
      bubbleTimer = setTimeout(function(){
        bubble.classList.remove('show');
      }, ttl);
    }
  }

  function hop(){
    pet.classList.remove('hop');
    void pet.offsetWidth;
    pet.classList.add('hop');
    setTimeout(function(){ pet.classList.remove('hop'); }, 520);
  }

  function wave(){
    pet.classList.remove('wave');
    void pet.offsetWidth;
    pet.classList.add('wave');
    setTimeout(function(){ pet.classList.remove('wave'); }, 1400);
  }

  function yawn(){
    if(clinging) return;
    pet.classList.remove('yawn');
    void pet.offsetWidth;
    pet.classList.add('yawn');
    setTimeout(function(){ pet.classList.remove('yawn'); }, 1700);
  }

  function flop(on){
    if(on) pet.classList.add('flop');
    else   pet.classList.remove('flop');
  }

  // 空闲久了自己打个哈欠，随机间隔避免看着像定时器
  var idleTimer = null;
  function scheduleIdle(){
    if(idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){
      if(!dragging && !clinging) yawn();
      scheduleIdle();
    }, 40000 + Math.random() * 50000);
  }

  function touch(){ scheduleIdle(); }

  window.petEngine = {
    onTap:       function(){ touch(); hop();  say('嗯?', 'normal', 1600); },
    onDoubleTap: function(){ touch(); setMood('shy'); hop();
                             say('别戳了', 'pink', 1800);
                             setTimeout(function(){ setMood('calm'); }, 2200); },
    onLongPress: function(){ touch(); setMood('happy'); wave();
                             say('...', 'grey', 2000); },

    // 被拎起来：四肢乱蹬，同时清掉挂边和趴睡状态
    onDragStart: function(){
      touch();
      dragging = true;
      clinging = false;
      stage.classList.remove('cling-l','cling-r');
      pet.classList.remove('cling','side-l','side-r','flop','yawn');
      pet.classList.add('drag');
      setMood('jealous');
    },
    onDragEnd: function(){
      dragging = false;
      pet.classList.remove('drag');
      setMood('calm');
    },
    // side: 'left' | 'right'，Kotlin 侧贴边动画结束后调
    onCling: function(side){
      clinging = true;
      var right = (side === 'right');
      pet.classList.remove('drag','flop','yawn');
      pet.classList.add('cling', right ? 'side-r' : 'side-l');
      pet.classList.remove(right ? 'side-l' : 'side-r');
      stage.classList.remove('cling-l','cling-r');
      stage.classList.add(right ? 'cling-r' : 'cling-l');
      setMood('sleepy');
    },
    onRelease: function(){
      clinging = false;
      stage.classList.remove('cling-l','cling-r');
      pet.classList.remove('cling','side-l','side-r');
      setMood('calm');
    },

    applyState: function(json){
      try{
        var s = (typeof json === 'string') ? JSON.parse(json) : json;
        if(s.mood){
          setMood(s.mood);
          flop(s.mood === 'sleeping');
        }
        if(typeof s.heat === 'number') setHeat(s.heat);
        if(s.text) say(s.text, s.style, s.ttl_ms || 4000);
        if(s.bubble && s.bubble.text){
          say(s.bubble.text, s.bubble.style, s.bubble.ttl_ms);
        }
        if(s.action === 'wave') wave();
        if(s.action === 'yawn') yawn();
        if(s.action === 'sleep') flop(true);
        if(s.action === 'wake' || s.action === 'hop'){ flop(false); hop(); }
      }catch(e){ /* 状态坏了就跳过这一轮 */ }
    }
  };

  setMood('calm');
  scheduleIdle();
})();
</script>
</body>
</html>
